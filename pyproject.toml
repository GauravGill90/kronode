[project]
name = "kronode"
version = "0.2.0"
description = "Extract team conventions from git history, serve via MCP to any AI coding tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Gaurav Gill" }]
keywords = ["mcp", "conventions", "ai-coding", "organizational-memory", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "fastembed>=0.4.0",
    "mcp>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
byok = ["openai>=2.28.0", "anthropic>=0.40.0"]
http = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
postgres = ["asyncpg>=0.30.0"]

[project.scripts]
kronode = "kronode.cli.main:cli"

[project.urls]
Homepage = "https://github.com/GauravGill90/kronode"
Repository = "https://github.com/GauravGill90/kronode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kronode"]

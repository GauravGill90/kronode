[project]
name = "kronode-backend"
version = "0.1.0"
description = "Kronode autonomous AI developer — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "anthropic>=0.40.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.19",
    "python-jose[cryptography]>=3.3.0",
    "clerk-backend-api>=1.7.0",
    "google-genai>=1.67.0",
    "openai>=2.28.0",
    "langgraph>=1.1.3",
    "claude-agent-sdk>=0.1.51",
    "slowapi>=0.1.9",
    "sentry-sdk[celery,fastapi]>=2.0.0",
    "cryptography>=43.0.0",
    "slack-bolt>=1.18.0",
    "PyJWT>=2.8.0",
    "aiohttp>=3.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
